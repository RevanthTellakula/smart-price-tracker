<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Price Tracker</title>
    <style>
        body { font-family: Segoe UI, Arial, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #152238; }
        a { color: #2563eb; }
        .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; background: #fffbeb; }
    </style>
</head>
<body>
    <h1>Smart Price Tracker</h1>
    <div class="card" id="status">Checking if the app server is running...</div>
    <script>
        const status = document.getElementById("status");
        const help = `
            <p>Opening this HTML file is not enough. The Python server must be running first.</p>
            <ol>
                <li>Go back to the <strong>Smart Price Tracker</strong> folder.</li>
                <li>Double-click <strong>Start Smart Price Tracker.bat</strong>.</li>
                <li>Wait for the black window to say the app is running.</li>
                <li>Then open <a href="http://127.0.0.1:5000">http://127.0.0.1:5000</a>.</li>
            </ol>
            <p>Do not use <code>templates\\index.html</code> from File Explorer. That page has no server, so you will see Failed to fetch.</p>
        `;

        fetch("http://127.0.0.1:5000/api/stats")
            .then((response) => {
                if (!response.ok) throw new Error("not running");
                window.location.replace("http://127.0.0.1:5000/");
            })
            .catch(() => {
                status.innerHTML = help;
            });
    </script>
</body>
</html>
